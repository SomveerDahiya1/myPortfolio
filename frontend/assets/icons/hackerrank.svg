<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="hrDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141b26"/>
      <stop offset="100%" stop-color="#0c1017"/>
    </linearGradient>
    <linearGradient id="hrGreen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2ee06a"/>
      <stop offset="100%" stop-color="#12c454"/>
    </linearGradient>
    <linearGradient id="hrShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect x="4" y="4" width="56" height="56" rx="10" fill="url(#hrDark)" stroke="#000000" stroke-width="1"/>

  <!-- H letter -->
  <g fill="#ffffff">
    <rect x="13" y="18" width="9" height="28"/>
    <rect x="28" y="18" width="9" height="28"/>
    <rect x="13" y="27.5" width="24" height="9"/>
  </g>

  <!-- Green block -->
  <rect x="41" y="18" width="14" height="28" fill="url(#hrGreen)"/>

  <rect x="4" y="4" width="56" height="18" rx="10" fill="url(#hrShine)"/>
</svg>

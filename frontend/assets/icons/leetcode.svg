<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect x="0" y="0" width="64" height="64" rx="10" fill="#000000"/>

  <!-- white main stroke: from top point, angling down to left elbow, then curving down to mid-left -->
  <path d="M36 13 L21 27.5 C18.5 29.8 18.5 34.2 21 36.5 L29 44"
        fill="none" stroke="#ffffff" stroke-width="7.5"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- orange main stroke: continues from mid-left curve down to bottom point -->
  <path d="M29 44 L37 51.5 C39.5 53.8 43 53.5 45.5 51"
        fill="none" stroke="#ffa116" stroke-width="7.5"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- orange hook curling back near the top -->
  <path d="M29 23 C33 19.5 38.5 20 41.5 24"
        fill="none" stroke="#ffa116" stroke-width="7.5"
        stroke-linecap="round"/>

  <!-- gray horizontal bar -->
  <rect x="27" y="28.75" width="21" height="6.5" rx="3.25" fill="#b3b3b3"/>
</svg>
